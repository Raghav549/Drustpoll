name: Full-stack E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drustpoll
          POSTGRES_PASSWORD: drustpoll
          POSTGRES_DB: drustpoll
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://drustpoll:drustpoll@127.0.0.1:5432/drustpoll
      SESSION_PEPPER: ci-session-pepper-0123456789abcdef0123456789
      PASSWORD_PEPPER: ci-password-pepper-0123456789abcdef0123456789
      NODE_ENV: development
      MEDIA_STORAGE_DRIVER: local
      # Abuse limits are raised only for this single-origin CI run; production
      # defaults (8 signups/hour, 120 req/min) are unchanged in code.
      RATE_LIMIT_MAX_REQUESTS: '5000'
      AUTH_LIMIT_SIGNUP: '500'
      AUTH_LIMIT_LOGIN: '500'
      AUTH_LIMIT_OTP: '500'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2525'
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: noreply@drustpoll.test
      API_URL: http://127.0.0.1:4400
      OTP_FILE: /tmp/drustpoll-otp.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Run migrations
        working-directory: server
        run: npx tsx src/migrate.ts

      - name: Start SMTP sink (real delivery path)
        run: |
          node scripts/dev-smtp-sink.mjs 2525 "$OTP_FILE" &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/2525) >/dev/null 2>&1 && break; sleep 1; done

      - name: Start API
        working-directory: server
        run: |
          PORT=4400 npx tsx src/index.ts &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4400/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4400/health

      - name: Start media worker
        working-directory: server
        run: npx tsx src/run-media-worker.ts &

      - name: Full-stack end-to-end smoke
        run: node scripts/e2e-full-smoke.mjs
