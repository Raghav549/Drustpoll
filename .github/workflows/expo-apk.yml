name: Expo Android APK

on:
  push:
    branches: [main, fix/eas-apk-build]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'scripts/**'
      - '.github/workflows/expo-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: apk
        type: choice
        options:
          - apk
          - preview
          - production

env:
  EAS_PROFILE: ${{ inputs.profile || 'apk' }}

jobs:
  native-compile:
    name: Native Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate EAS/Expo source configuration
        run: node scripts/eas-check-config.mjs
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: i18n locale coverage
        run: node scripts/check-i18n-coverage.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_GIT_STATUS: '1'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drustpoll-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  eas-build:
    name: EAS installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 47
    needs: native-compile
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # This is a public client endpoint, not a secret. Keep the production API
      # endpoint in the workflow so the APK build cannot silently fall back to
      # a missing GitHub secret.
      EXPO_PUBLIC_API_URL: https://drustpoll.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate EAS/Expo source configuration
        run: node scripts/eas-check-config.mjs
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: i18n locale coverage
        run: node scripts/check-i18n-coverage.mjs
      - name: Check cloud build credentials and API URL
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for the cloud EAS APK job."
            echo "Add the Expo access token as repository secret EXPO_TOKEN."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_API_URL must use HTTPS for installed production Android builds."; exit 1 ;;
          esac
          echo "Public API URL configured: $EXPO_PUBLIC_API_URL"
      - name: Typecheck
        run: npm run typecheck
      - name: Link existing EAS project or create it
        shell: bash
        run: |
          if [ -n "$EAS_PROJECT_ID" ]; then
            npx eas-cli@latest init --id "$EAS_PROJECT_ID" --force --non-interactive
          else
            npx eas-cli@latest init --account kashyao_07 --force --non-interactive
          fi
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      - name: Sync public API URL to EAS environments
        shell: bash
        run: |
          for environment in development preview production; do
            npx eas-cli@latest env:set \
              --name EXPO_PUBLIC_API_URL \
              --value "$EXPO_PUBLIC_API_URL" \
              --environment "$environment" \
              --visibility plaintext \
              --scope project \
              --non-interactive
          done
      - name: Build Android APK with EAS
        run: npx eas-cli@latest build --platform android --profile "$EAS_PROFILE" --non-interactive --wait
