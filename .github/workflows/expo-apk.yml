name: Expo Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'scripts/**'
      - '.github/workflows/expo-apk.yml'
  workflow_dispatch:

env:
  EXPO_PUBLIC_API_URL: https://drustpoll.onrender.com

jobs:
  android-release:
    name: Standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate EAS/Expo source configuration
        run: node scripts/eas-check-config.mjs
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: i18n locale coverage
        run: node scripts/ci-i18n-coverage.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_GIT_STATUS: '1'
          EXPO_PUBLIC_API_URL: https://drustpoll.onrender.com
      - name: Verify production bundle configuration
        run: |
          test -f android/app/build.gradle
          grep -q "com.drustpoll.app" android/app/build.gradle
          echo "Android project generated for production package com.drustpoll.app"
      - name: Assemble standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://drustpoll.onrender.com
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK contains embedded JS bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/index\.android.*\.bundle' >/dev/null
          sha256sum "$APK"
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: drustpoll-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
