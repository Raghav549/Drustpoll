name: Expo Android APK

on:
  push:
    branches: [main, fix/eas-apk-build]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'scripts/**'
      - '.github/workflows/expo-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: apk
        type: choice
        options:
          - apk
          - preview
          - production

env:
  EAS_PROFILE: ${{ inputs.profile || 'apk' }}

jobs:
  native-compile:
    name: Native Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate EAS/Expo source configuration
        run: node scripts/eas-check-config.mjs
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_GIT_STATUS: '1'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drustpoll-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  eas-build:
    name: EAS installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 47
    needs: native-compile
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate EAS/Expo source configuration
        run: node scripts/eas-check-config.mjs
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Check EAS credentials
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for the cloud EAS APK job."
            echo "Add an Expo access token as the repository secret EXPO_TOKEN, then re-run this workflow."
            exit 1
          fi
      - name: Link existing EAS project or create it
        shell: bash
        run: |
          if [ -n "$EAS_PROJECT_ID" ]; then
            npx eas-cli@latest init --id "$EAS_PROJECT_ID" --force --non-interactive
          else
            npx eas-cli@latest init --account kashyao_07 --force --non-interactive
          fi
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      - name: Build Android APK with EAS
        run: npx eas-cli@latest build --platform android --profile "$EAS_PROFILE" --non-interactive --wait
