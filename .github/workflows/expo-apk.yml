name: Expo Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: apk
        type: choice
        options:
          - apk
          - preview
          - production

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Build Android APK with EAS
        run: npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait
