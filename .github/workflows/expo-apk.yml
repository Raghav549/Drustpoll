name: Expo Android APK

on:
  push:
    paths:
      - '.github/workflows/expo-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: apk
        type: choice
        options:
          - apk
          - preview
          - production

env:
  EAS_PROFILE: ${{ inputs.profile || 'apk' }}

jobs:
  native-compile:
    name: Native Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_GIT_STATUS: '1'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drustpoll-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  eas-build:
    name: EAS installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 47
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate resolved Expo config
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Check EAS credentials
        id: eas-auth
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EAS token is not configured; skipping cloud EAS build. The native job still produces an installable debug APK artifact."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Link or create EAS project
        if: steps.eas-auth.outputs.available == 'true'
        run: npx eas-cli@latest init --account kashyao_07 --force --non-interactive
      - name: Persist EAS project link
        if: steps.eas-auth.outputs.available == 'true'
        shell: bash
        run: |
          if git diff --quiet -- app.json; then
            echo "EAS project link already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "build: persist EAS project link"
          git push origin HEAD:main
      - name: Build Android APK with EAS
        if: steps.eas-auth.outputs.available == 'true'
        run: npx eas-cli@latest build --platform android --profile "$EAS_PROFILE" --non-interactive --wait
